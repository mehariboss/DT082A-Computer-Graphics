<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DT082A Project</title>
  <style>body { margin: 0; background: #111; } canvas { display: block; margin: 20px auto; }</style>

  <!-- Vertex shader: körs en gång per hörn (vertex), bestämmer var det hamnar på skärmen -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 aPosition;
    attribute vec4 aColor;
    varying vec4 vColor;
    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;

    void main() {
      vColor = aColor;
      gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;
    }
  </script>

  <!-- Fragment shader: körs en gång per pixel, bestämmer färgen -->
  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 vColor;

    void main() {
      gl_FragColor = vColor;
    }
  </script>

  <script src="libs/MV.js"></script>
  <script src="libs/initShaders.js"></script>
  <script src="src/main.js"></script>
</head>
<body>
  <canvas id="gl-canvas" width="800" height="600">Your browser does not support WebGL.</canvas>
</body>
</html>
